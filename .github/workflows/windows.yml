name: Windows build, test and live UI test

# Builds the Rust binaries on Windows (MSVC) and runs, on windows-latest (Server, amd64) and
# windows-11-arm (Windows 11, arm64): the unit tests, the package's .test.md files, the
# aux4/computer conformance suite and the live UI suite (package/test-live: Calculator and Notepad
# driven in the background). Hosted Windows runners have an interactive, elevated desktop session
# where UI Automation, SendInput, screen capture and OCR work.
# Called by ci.yml on branches and by publish.yml before publishing.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: never
  # aux4 runs command lines with $SHELL (default /bin/sh, which doesn't exist on Windows)
  SHELL: bash

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Rust targets
        shell: bash
        run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      - name: Unit tests
        shell: bash
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build amd64
        shell: bash
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build arm64
        shell: bash
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Collect binaries
        shell: bash
        run: mkdir -p package/dist/windows/amd64 package/dist/windows/arm64 && cp target/x86_64-pc-windows-msvc/release/aux4-computer-windows.exe package/dist/windows/amd64/ && cp target/aarch64-pc-windows-msvc/release/aux4-computer-windows.exe package/dist/windows/arm64/ && ls -la package/dist/windows/*/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: package/dist
          if-no-files-found: error

  test:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: amd64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      # aux4/test runs each test's command line through child_process.exec, which uses ComSpec.
      ComSpec: C:\Program Files\Git\bin\bash.exe
      # Keep ~/.aux4.config on the checkout's drive (D:): jest can't resolve its runner across drives.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: package/dist

      # aux4.sh supports Linux and macOS only: take aux4 from its GitHub release.
      - name: Install aux4
        shell: bash
        run: |
          TAG=$(basename "$(curl -fsSIL -o /dev/null -w '%{url_effective}' https://github.com/aux4/aux4/releases/latest)")
          curl -fsSL -o "$RUNNER_TEMP/aux4.zip" "https://github.com/aux4/aux4/releases/download/${TAG}/windows_${{ matrix.arch }}_aux4_aux4_${TAG#v}.zip"
          mkdir -p "$HOME/.aux4.config/packages" && unzip -o -q "$RUNNER_TEMP/aux4.zip" -d "$HOME/.aux4.config/packages"
          cygpath -w "$HOME/.aux4.config/packages/aux4/aux4" >> "$GITHUB_PATH"

      - name: Load aux4/test and aux4/computer
        shell: bash
        run: aux4 ci windows-packages

      - name: Link binary
        shell: bash
        run: aux4 ci link --arch ${{ matrix.arch }}

      - name: Info
        shell: bash
        working-directory: package
        run: aux4 computer win info | jq -c '{provider, contract, platform, version, permissions}'

      - name: Package tests
        shell: bash
        working-directory: package
        run: aux4 test run test

      - name: Conformance (aux4/computer)
        shell: bash
        working-directory: package
        run: aux4 computer conformance --provider win

  test-live:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Server: the classic Win32 Calculator (win32calc) and Notepad
          - os: windows-latest
            arch: amd64
          # Windows 11: the UWP Calculator and the new Notepad
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      ComSpec: C:\Program Files\Git\bin\bash.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: package/dist

      - name: Install aux4
        shell: bash
        run: |
          TAG=$(basename "$(curl -fsSIL -o /dev/null -w '%{url_effective}' https://github.com/aux4/aux4/releases/latest)")
          curl -fsSL -o "$RUNNER_TEMP/aux4.zip" "https://github.com/aux4/aux4/releases/download/${TAG}/windows_${{ matrix.arch }}_aux4_aux4_${TAG#v}.zip"
          mkdir -p "$HOME/.aux4.config/packages" && unzip -o -q "$RUNNER_TEMP/aux4.zip" -d "$HOME/.aux4.config/packages"
          cygpath -w "$HOME/.aux4.config/packages/aux4/aux4" >> "$GITHUB_PATH"

      - name: Load aux4/test and aux4/computer
        shell: bash
        run: aux4 ci windows-packages

      - name: Link binary
        shell: bash
        run: aux4 ci link --arch ${{ matrix.arch }}

      - name: Permissions
        shell: bash
        working-directory: package
        run: aux4 computer win permissions | tee "$RUNNER_TEMP/permissions.json" && jq -e '.desktop.granted' "$RUNNER_TEMP/permissions.json"

      - name: Live UI tests
        shell: bash
        working-directory: package
        run: aux4 test run test-live

      - name: Capture the screen
        if: always()
        shell: bash
        working-directory: package
        run: mkdir -p "$RUNNER_TEMP/live" && aux4 computer win screenshot --output "$RUNNER_TEMP/live/screen-final.png" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-${{ matrix.os }}
          path: ${{ runner.temp }}/live
