name: Publish Package

# main -> prod hub (token minted from AUX4_PUBLISHER_* client credentials against prod SSO)
# dev  -> dev hub  (token minted from AUX4_DEV_PUBLISHER_* client credentials against dev SSO,
#         registry pointed at the dev hub). Both call aux4/action@v1 command:publish.
# The binaries are built and tested on Windows (windows.yml); aux4/action's publish step runs in
# Docker, which only Linux runners have, so the publish job downloads the tested binaries.
on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!.gitignore'

  workflow_dispatch:
    inputs:
      level:
        description: 'Release level (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-package-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lint
        uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'

  windows:
    needs: [lint]
    uses: ./.github/workflows/windows.yml

  publish:
    needs: [windows]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: package/dist

      - name: Mint prod hub publish token
        id: mint
        if: github.ref_name == 'main'
        env:
          CLIENT_ID: ${{ secrets.AUX4_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Mint dev hub publish token
        id: devmint
        if: github.ref_name == 'dev'
        env:
          CLIENT_ID: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::dev publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://dev.sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token from dev SSO"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Publish package
        id: publish
        uses: aux4/action@v1
        with:
          command: publish
          level: ${{ inputs.level || 'patch' }}
          aux4_token: ${{ github.ref_name == 'dev' && steps.devmint.outputs.token || steps.mint.outputs.token }}
          registry: ${{ github.ref_name == 'dev' && 'https://dev.api.hub.aux4.io/v1/packages' || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # End to end on a clean Windows runner, the way a user does it: install aux4 and pkger with the
  # documented installer (curl https://aux4.sh | sh, from Git Bash; dev.* on dev = the dev hub),
  # `pkger install` the version just published, and run it: ci/installed.test.md. No overrides.
  verify-install:
    needs: [publish]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      INSTALL_PREFIX: ${{ github.ref_name == 'dev' && 'dev.' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install aux4
        shell: bash
        run: curl -fsSL "https://${INSTALL_PREFIX}aux4.sh" | sh && cygpath -w "$HOME/.aux4.config/packages/aux4/aux4" >> "$GITHUB_PATH"

      - name: Install pkger and the published package
        shell: bash
        run: |
          curl -fsSL "https://${INSTALL_PREFIX}pkger.aux4.sh" | sh
          aux4 aux4 pkger install aux4/system-installer-npm aux4/test aux4/computer-windows@${{ needs.publish.outputs.version }}
          aux4 aux4 pkger list

      - name: Run it
        shell: bash
        run: |
          aux4 computer win info
          aux4 computer providers
          mkdir -p "$RUNNER_TEMP/verify" && cp ci/installed.test.md "$RUNNER_TEMP/verify/" && cd "$RUNNER_TEMP/verify" && aux4 test run
