name: Publish Package

# main -> prod hub (token minted from AUX4_PUBLISHER_* client credentials against prod SSO)
# dev  -> dev hub  (token minted from AUX4_DEV_PUBLISHER_* client credentials against dev SSO,
#         registry pointed at the dev hub). Both call aux4/action@v1 command:publish.
# The binaries are built and tested on Windows (windows.yml); aux4/action's publish step runs in
# Docker, which only Linux runners have, so the publish job downloads the tested binaries.
on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!.gitignore'

  workflow_dispatch:
    inputs:
      level:
        description: 'Release level (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-package-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lint
        uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'

  windows:
    needs: [lint]
    uses: ./.github/workflows/windows.yml

  publish:
    needs: [windows]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: package/dist

      - name: Mint prod hub publish token
        id: mint
        if: github.ref_name == 'main'
        env:
          CLIENT_ID: ${{ secrets.AUX4_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Mint dev hub publish token
        id: devmint
        if: github.ref_name == 'dev'
        env:
          CLIENT_ID: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::dev publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://dev.sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token from dev SSO"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Publish package
        id: publish
        uses: aux4/action@v1
        with:
          command: publish
          level: ${{ inputs.level || 'patch' }}
          aux4_token: ${{ github.ref_name == 'dev' && steps.devmint.outputs.token || steps.mint.outputs.token }}
          registry: ${{ github.ref_name == 'dev' && 'https://dev.api.hub.aux4.io/v1/packages' || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # The published package, downloaded from the hub it went to (the Windows zip pkger would
  # install; pkger can't install itself on Windows yet), runs on Windows: ci/installed.test.md.
  verify-install:
    needs: [publish]
    runs-on: windows-latest
    env:
      SHELL: bash
      ComSpec: C:\Program Files\Git\bin\bash.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install aux4
        shell: bash
        run: |
          TAG=$(basename "$(curl -fsSIL -o /dev/null -w '%{url_effective}' https://github.com/aux4/aux4/releases/latest)")
          curl -fsSL -o "$RUNNER_TEMP/aux4.zip" "https://github.com/aux4/aux4/releases/download/${TAG}/windows_amd64_aux4_aux4_${TAG#v}.zip"
          mkdir -p "$HOME/.aux4.config/packages" && unzip -o -q "$RUNNER_TEMP/aux4.zip" -d "$HOME/.aux4.config/packages"
          cygpath -w "$HOME/.aux4.config/packages/aux4/aux4" >> "$GITHUB_PATH"

      - name: Install jest
        shell: bash
        run: npm i -g jest

      - name: Load aux4/test and aux4/computer
        shell: bash
        run: aux4 ci windows-packages --computerHub ${{ github.ref_name == 'dev' && 'https://dev.api.hub.aux4.io' || 'https://api.hub.aux4.io' }}

      - name: Download the published package
        shell: bash
        run: aux4 ci installed-package --version ${{ needs.publish.outputs.version }} --hub ${{ github.ref_name == 'dev' && 'https://dev.api.hub.aux4.io' || 'https://api.hub.aux4.io' }}

      - name: Run it
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/verify" && cp ci/installed.test.md "$RUNNER_TEMP/verify/" && cd "$RUNNER_TEMP/verify" && aux4 test run
